[project]
name = "occupify-agentic"
version = "0.1.0"
description = "Occupify AI Agentic service"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "pydantic",
  "pydantic-settings",
  "pydantic-ai-slim[zai]",
  "faststream[rabbit]",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "httpx",
  "docling",
  "pypdfium2",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "respx",
  "ruff",
  "reportlab",
  "aiosqlite>=0.22.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
  "integration: needs Postgres + RabbitMQ",
  "docling: loads Docling models",
]
