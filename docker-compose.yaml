services:
  postgres-agentic:
    image: docker.io/pgvector/pgvector:pg16
    container_name: occupify-postgres-agentic
    environment:
      POSTGRES_DB: occupify_agentic
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["${POSTGRES_PORT:-5535}:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
    volumes: [postgres_agentic_data:/var/lib/postgresql/data]
    networks: [occupify-network]

  agentic:
    build: .
    image: occupify-agentic:local
    container_name: occupify-agentic
    env_file: .env
    ports: ["${APP_PORT:-8186}:8186"]
    depends_on:
      postgres-agentic: { condition: service_healthy }
      cv-compiler: { condition: service_healthy }
    restart: unless-stopped
    networks: [occupify-network, cv-compiler-network]

  cv-compiler:
    build:
      context: .
      dockerfile: Dockerfile.cv-compiler
    image: occupify-cv-compiler:local
    container_name: occupify-cv-compiler
    read_only: true
    tmpfs: [/tmp:size=256m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 768m
    cpus: 2
    ports: ["127.0.0.1:${CV_COMPILER_PORT:-8190}:8190"]
    restart: unless-stopped
    networks: [cv-compiler-network]

volumes:
  postgres_agentic_data:

networks:
  occupify-network:
    external: true
  cv-compiler-network: {}
