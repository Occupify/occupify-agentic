name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    services:
      postgres:
        image: docker.io/pgvector/pgvector:pg16
        env:
          POSTGRES_DB: occupify_agentic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_port_listener"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install system dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-vie tesseract-ocr-eng

      - name: Cache Docling models
        uses: actions/cache@v4
        with:
          path: /opt/docling_models
          key: docling-models-${{ runner.os }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint and Format Check (Ruff)
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Skills Check
        run: uv run python -m app.agents.skill_registry --check

      - name: Run Unit Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/occupify_agentic
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
          APP_ENV: test
          ML_ENABLED: "false"
        run: |
          mkdir -p reports
          uv run pytest --junitxml=reports/junit.xml --cov=app tests/unit/

      - name: Run Integration Tests
        env:
          TEST_PG_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/occupify_agentic
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
          APP_ENV: test
        run: |
          uv run pytest -m integration --junitxml=reports/junit-integration.xml tests/integration/

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        continue-on-error: true
        with:
          name: Python Test Results
          path: reports/junit*.xml
          reporter: java-junit

  image-build:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (check only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: occupify-agentic:ci-test
